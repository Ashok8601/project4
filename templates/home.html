<!DOCTYPE html>
<html>
<head>
    <title>Iris Flower Species Prediction</title>
    <style>
        body {
            font-family: Arial;
            background: #e8f0fe;
            text-align: center;
            margin-top: 60px;
        }
        form {
            background: white;
            padding: 30px;
            display: inline-block;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        input {
            padding: 8px;
            margin: 10px;
            width: 200px;
            border-radius: 6px;
            border: 1px solid #aaa;
        }
        button {
            padding: 10px 20px;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005fa3;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Iris Flower Species Prediction</h1>
    <form method="POST">
        <input type="number" step="any" name="sepal_length" placeholder="Sepal Length (cm)" required><br>
        <input type="number" step="any" name="sepal_width" placeholder="Sepal Width (cm)" required><br>
        <input type="number" step="any" name="petal_length" placeholder="Petal Length (cm)" required><br>
        <input type="number" step="any" name="petal_width" placeholder="Petal Width (cm)" required><br>
        <button type="submit">Predict Species</button>
    </form>

    {% if prediction %}
        <h2>Predicted Species: {{ prediction }}</h2>
    {% endif %}

</body>
</html>
